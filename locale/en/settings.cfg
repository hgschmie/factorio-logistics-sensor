[mod-setting-name]
hps__ls-debug-mode=Debugging Mode
hps__ls-update_interval=Update interval (in ticks)
hps__ls-find_entity_interval=Entity scan interval (in ticks)
hps__ls-scan_offset=Scan offset
hps__ls-scan_range=Scan range

[mod-setting-description]
hps__ls-debug-mode=Enable debug functionality. Only turn on if you debug this mod.
hps__ls-update_interval=How often the sensor status is updated.
hps__ls-find_entity_interval=Scan interval for new entities if none has been found.
hps__ls-scan_offset=Width of the search area in front of a sensor.\nWARNING! Changing this may affect entity detection!
hps__ls-scan_range=Size of the search area in front of a sensor.\nWARNING! Changing this may affect entity detection!

[string-mod-setting]
hps__ls-debug-mode-0=Off
hps__ls-debug-mode-1=Show scan area
hps__ls-debug-mode-2=(unused)
hps__ls-debug-mode-3=(unused)
